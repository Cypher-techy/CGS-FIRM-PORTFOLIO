name: CGS database migrations
on:
  pull_request:
    paths: ['supabase/**', 'scripts/*owner*', 'scripts/check-db-target.mjs', '.github/workflows/database.yml', 'tests/**']
  workflow_dispatch:
    inputs:
      provision_owner:
        description: Verify/provision the pinned initial super administrator after migration
        type: boolean
        default: true
      allow_create:
        description: Permit first-time Auth creation (also requires CGS_OWNER_UID=new)
        type: boolean
        default: false
      allow_promotion:
        description: Permit initial promotion of the verified matching existing staff profile
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: {node-version: 22, cache: npm}
      - run: npm ci && npm test
      - uses: supabase/setup-cli@afb1b15109756ea5cf9d8985a359d9095235ca2b # v2.1.2
        with: {version: 2.75.0}
      - name: Apply migrations to disposable local Supabase and verify security
        run: |
          supabase start --exclude studio,imgproxy,edge-runtime,realtime,logflare,vector,supavisor
          psql -X -v ON_ERROR_STOP=1 postgresql://postgres:postgres@127.0.0.1:54322/postgres -f supabase/verify-deployment.sql
          supabase db push --local --dry-run
          node scripts/check-local-owner.mjs
  production:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    environment: production-database
    concurrency:
      group: cgs-production-database
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
    steps:
      - name: Fail closed without an actual approval of this environment for this run
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/approvals" | jq -e 'any(.[]; .state == "approved" and any(.environments[]?; .name == "production-database"))' >/dev/null
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - uses: supabase/setup-cli@afb1b15109756ea5cf9d8985a359d9095235ca2b # v2.1.2
        with: {version: 2.75.0}
      - name: Validate project, preview pending migrations, apply once and verify grants/RLS
        env:
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          node scripts/check-db-target.mjs
          supabase migration list --db-url "$SUPABASE_DB_URL"
          supabase db push --db-url "$SUPABASE_DB_URL" --dry-run
          supabase db push --db-url "$SUPABASE_DB_URL" --yes
          psql -X -v ON_ERROR_STOP=1 "$SUPABASE_DB_URL" -f supabase/verify-deployment.sql
      - name: Verify public Data API and email provider
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://${{ vars.SUPABASE_PROJECT_REF }}.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: npm run supabase:check
      - name: Provision or verify initial owner
        if: inputs.provision_owner
        env:
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CGS_OWNER_EMAIL: ${{ vars.CGS_OWNER_EMAIL || 'cyphergreensystemsfirm@gmail.com' }}
          CGS_OWNER_UID: ${{ vars.CGS_OWNER_UID || '92277333-9bce-4d73-b7c8-c0c32688dd99' }}
          CGS_INITIAL_PASSWORD: ${{ secrets.CGS_INITIAL_PASSWORD }}
          CGS_ALLOW_CREATE: ${{ inputs.allow_create }}
          CGS_ALLOW_PROMOTION: ${{ inputs.allow_promotion }}
        run: node scripts/provision-owner.mjs
